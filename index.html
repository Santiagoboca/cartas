const VW=540,VH=1000,PA=120,PH=758;
const carta=document.getElementById('carta'),f=document.getElementById('f'),aviso=document.getElementById('aviso');
function ajustar(){
  const m=Math.round(Math.min(innerWidth,innerHeight)*0.03);
  const s=Math.min((innerWidth-2*m)/VW,(innerHeight-2*m)/PH);
  carta.style.width=(VW*s)+'px';carta.style.height=(PH*s)+'px';
  f.style.width=VW+'px';f.style.height=VH+'px';
  f.style.transform='scale('+s+') translateY('+(-PA)+'px)';
}
async function sha(t){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)));}
async function abrir(){
  const c=decodeURIComponent(location.hash.slice(1)).trim().toLowerCase();
  if(!c){aviso.textContent='Escanea el código QR de tu carta.';return;}
  const id=Array.from(await sha('id:'+c)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16);
  if(!D[id]){aviso.textContent='Este código no corresponde a ninguna carta.';return;}
  const x=Uint8Array.from(atob(D[id]),ch=>ch.charCodeAt(0));
  let k=new Uint8Array(0);
  for(let i=0;k.length<x.length;i++){const b=await sha('clave:'+c+':'+i);const n=new Uint8Array(k.length+b.length);n.set(k);n.set(b,k.length);k=n;}
  const url=new TextDecoder().decode(x.map((v,i)=>v^k[i]));
  aviso.remove();carta.style.display='block';ajustar();f.src=url;
}
addEventListener('resize',ajustar);
addEventListener('hashchange',()=>location.reload());
for(const ev of ['touchmove','wheel','keydown','contextmenu'])addEventListener(ev,e=>{if(ev!=='touchmove'||e.touches.length<2)e.preventDefault();},{passive:false});
abrir().catch(()=>{aviso.textContent='No se pudo abrir la carta. Vuelve a escanear el código.';});
</script>
